name: GitOps Terraform Engine

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitops-engine:
    name: Terraform Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Stable Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: true

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_ACCESS_SECRET }}
          aws-region: ap-southeast-2

      - name: Workspace Initialization
        run: terraform init

      # Compares your laptop branch code against the live AWS state file
      - name: Evaluate Infrastructure Changes
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      # Generates a clear, clickable summary directly inside your GitHub interface
      - name: Post Execution Logs to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Infrastructure Delta Plan 📋
            
            <details><summary>Show Complete Resource Modifications Summary</summary>
            
            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Halts the runner if the evaluation step failed syntactically
      - name: Status Safeguard Check
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Executes resource provisioning or final teardown upon code merge to main
      - name: Commit State Sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve

