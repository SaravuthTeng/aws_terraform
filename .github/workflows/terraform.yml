name: GitOps Terraform Automation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write # Allows GitHub to post the plan results directly onto your PR screen

jobs:
  terraform:
    name: Terraform GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_ACCESS_SECRET }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        run: terraform init

      # 1. SEE WHAT WILL BE CREATED OR DELETED HERE
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      # 2. POSTS THE LIVE INFRASTRUCTURE LIST TO YOUR GITHUB SCREEN
      - name: Post Plan to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan Status 📋
            
            <details><summary>Show Full Cloud Plan</summary>
            
            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"

      # 3. EXECUTE THE CHANGES ONLY ON MERGE TO MAIN
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
